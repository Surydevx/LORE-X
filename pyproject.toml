[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lorex"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "httpx",
    "jinja2",
    "litellm",
    "aiofiles",
    "python-dotenv",
    "rich>=15.0.0",
]

[project.scripts]
lorex = "lorex.cli:main"

[tool.setuptools.packages.find]
include = ["lorex*"]

[tool.setuptools.package-data]
lorex = ["prompts/*.jinja2", "api/static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "optuna",
    "zensical>=0.0.59",
]
