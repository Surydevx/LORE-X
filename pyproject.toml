[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lorex"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "httpx",
    "jinja2",
    "optuna",
    "litellm",
    "aiofiles"
]

[project.scripts]
lorex = "lorex.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
